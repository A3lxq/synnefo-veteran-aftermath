services:
  aftermath:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: halcyon-veteran-aftermath
    environment:
      - CTF_SECRET=${CTF_SECRET}
    ports:
      - "8007:80"
      - "2207:22"
    networks:
      - aftermath-net

networks:
  aftermath-net:
    driver: bridge
